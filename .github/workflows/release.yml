name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish the current Cargo.toml version directly with Trusted Publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Publish release
    runs-on: [self-hosted, Linux, ARM64, oci-build]
    if: ${{ github.repository_owner == '0809android' }}
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - &install-rust
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify package
        run: cargo publish --dry-run --locked

      - name: Publish release
        if: ${{ !inputs.force_publish }}
        uses: release-plz/action@v0.5.128
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate crates.io
        if: ${{ inputs.force_publish }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: ${{ inputs.force_publish }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Create GitHub release
        if: ${{ inputs.force_publish }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "japanese-text") | .version')"
          gh release create "v${version}" --target "${GITHUB_SHA}" --title "v${version}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-pr:
    name: Create release PR
    runs-on: [self-hosted, Linux, ARM64, oci-build]
    if: ${{ github.repository_owner == '0809android' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust

      - name: Create release PR
        uses: release-plz/action@v0.5.128
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
